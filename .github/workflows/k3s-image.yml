name: Publish k3s image

# exeuntu-k3s(预装 k3s + gVisor)。改 k3s/ 或本 workflow 即 build+push 到 ghcr(public)。
# 版本 tag = v0.0.<run_number>(唯一);exe.dev 缓存 latest,故 VM 用具体版本 tag。
on:
  push:
    branches: [main]
    paths:
      - "k3s/**"
      - ".github/workflows/k3s-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lollipopkit/exeuntu-k3s

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: k3s
          file: k3s/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Print image ref
        run: echo "Pushed ${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }}"
